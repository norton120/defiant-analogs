# Fuel sender: KUS SSS/SSL series, 25", 240-33 Ohm (US standard: 240 = empty, 33 = full).
# Wiring: R_REF from 3.3V to the ADC node, sender from the ADC node to ground.
substitutions:
  # Value of the inline divider resistor, in ohms. Measure the actual part with a
  # DMM and put the real value here -- a 5% 150R part can be anywhere in 142.5-157.5.
  r_ref: "150.0"
  # Rail feeding the top of the divider. Measure the ESP32 3V3 pin under load.
  v_supply: "3.3"
  # Sender endpoints.
  r_empty: "240.0"
  r_full: "33.0"
  # Outside this window the reading is a fault (open circuit, short, or a chafed
  # wire), not a fuel level. 320R still reads 2.25V, safely below the ADC's clip
  # point, so an open circuit is genuinely detectable rather than just saturated.
  r_fault_high: "320.0"
  r_fault_low: "10.0"

esphome:
  name: defiant-analogs
  friendly_name: Defiant Analogs

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: "SVDefiant"
  password: !secret wifi_password
  ap:
    ssid: "Defiant Analogs Fallback"
    password: !secret ap_password

captive_portal:

external_components:
  - source:
      type: local
      path: components
    components: [signalk]

logger:

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

sensor:
  # Sampled and published every second. Median-of-3 rejects a single glitchy
  # ADC sample (e.g. a splash off the pour hitting the float arm) without
  # adding real lag -- fast enough to read live while filling the tank and
  # know when to stop. If it's still too laggy, drop window_size to 1 to
  # publish raw samples; if it's too twitchy at the dock, raise both back up
  # (60/60 gives a ~60s-smoothed reading, better suited to slosh underway).
  - platform: adc
    pin: GPIO36
    name: "Fuel Sender Voltage"
    id: fuel_voltage
    attenuation: 12db
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: 1s
    filters:
      - median:
          window_size: 3
          send_every: 1
    on_value:
      # Keep the derived sensors in lockstep with the voltage they came from;
      # these run in order, so resistance is fresh before level reads it.
      then:
        - component.update: fuel_resistance
        - component.update: fuel_level

  - platform: template
    name: "Fuel Sender Resistance"
    id: fuel_resistance
    unit_of_measurement: "Ω"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      const float v = id(fuel_voltage).state;
      if (std::isnan(v) || v >= ${v_supply}) return NAN;
      return (v * ${r_ref}) / (${v_supply} - v);

  # Tank fullness as a 0.0-1.0 ratio (Signal K / NMEA currentLevel convention).
  # For a 0-100 percentage instead, multiply by 100 and set unit to "%".
  - platform: template
    name: "Fuel Level"
    id: fuel_level
    icon: "mdi:gas-station"
    accuracy_decimals: 3
    update_interval: never
    lambda: |-
      const float r = id(fuel_resistance).state;
      if (std::isnan(r) || r > ${r_fault_high} || r < ${r_fault_low}) return NAN;
      const float level = (${r_empty} - r) / (${r_empty} - ${r_full});
      return clamp(level, 0.0f, 1.0f);
    filters:
      # The sender is linear in resistance vs. float arm angle, but the tank is
      # not necessarily linear in angle vs. gallons. Once you have stick or
      # fill-up data, add the correction here, e.g.:
      #   - calibrate_linear:
      #       - 0.00 -> 0.00
      #       - 0.50 -> 0.44
      #       - 1.00 -> 1.00
      []

  - platform: adc
    pin: GPIO39
    name: "Hall Sensor Voltage"
    attenuation: 12db
    update_interval: 10s

  - platform: wifi_signal
    name: "Defiant Analogs WiFi Signal"
    update_interval: 60s

# One clean line on the USB serial console every 2s -- meant for watching
# live while filling the tank, without wading through logger-VERBOSE noise
# from WiFi/API (ESPHome logs each sensor's own "Sending state" at VERBOSE,
# and a per-tag override can't go more verbose than the global DEBUG level).
interval:
  - interval: 2s
    then:
      - lambda: |-
          ESP_LOGI("fill", "level=%.1f%%  R=%.1fΩ  V=%.3fV",
                    id(fuel_level).state * 100.0f,
                    id(fuel_resistance).state,
                    id(fuel_voltage).state);

# Straight to Signal K (OpenPlotter) as UDP broadcast deltas -- see
# components/signalk/. Level is already the 0-1 ratio Signal K expects. A NaN
# level means the sender reading is outside the fault window above (open
# circuit, short, chafed wire), so that's what the alarm reports.
signalk:
  source: defiant-analogs
  sensors:
    - sensor_id: fuel_level
      path: tanks.fuel.0.currentLevel
  alarms:
    - sensor_id: fuel_level
      path: tanks.fuel.0.senderFault
      when: missing
      state: warn
      message: "Fuel sender fault: reading out of range (open circuit, short, or chafed wire)"
